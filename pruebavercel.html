<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CSE Elisagundin - Portal del Alumno</title>
    <link rel="icon" type="image/png" href="https://github.com/cse-elisagundin/horarios_alumnos/blob/main/image.png?raw=true">
    <link rel="apple-touch-icon" href="https://github.com/cse-elisagundin/horarios_alumnos/blob/main/image.png?raw=true">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Librería oficial de Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --c-primary: #fa65c3; 
            --c-secondary: #243c7a; 
            --bg-body: #f4f6f9; 
            --bg-container: #ffffff; 
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e1e9f0;
            --safe-area-bottom: env(safe-area-inset-bottom); 
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-body); 
            margin: 0; 
            padding: 20px 15px; 
            padding-bottom: 90px; 
            color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--bg-container); 
            padding: 30px 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(250, 101, 195, 0.15); 
            box-sizing: border-box;
        }

        .web-brand { text-align: center; margin-bottom: 15px; }
        .web-logo-img { height: 65px; object-fit: contain; }
        .brand-line { height: 5px; width: 80px; margin: 10px auto 20px; background: linear-gradient(90deg, var(--c-secondary), var(--c-primary)); border-radius: 10px; }
        
        .portal-title { text-align: center; color: var(--c-secondary); font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .portal-subtitle { text-align: center; color: var(--c-primary); font-size: 1rem; font-weight: 600; margin-bottom: 25px; }

        /* Estilos de Formulario de Login */
        .login-box { max-width: 400px; margin: 0 auto; text-align: center; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; text-align: left; }
        
        input.input-field { 
            width: 100%; 
            padding: 16px; 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 16px; 
            margin-bottom: 15px; 
            color: var(--c-secondary); 
            font-weight: 600; 
            background-color: #fafbfc; 
            box-sizing: border-box; 
            -webkit-appearance: none; 
            appearance: none; 
            transition: all 0.2s;
        }
        input.input-field:focus { 
            border-color: var(--c-primary); 
            outline: none; 
            background: white; 
            box-shadow: 0 0 0 4px rgba(250, 101, 195, 0.1); 
        }

        .btn-action { 
            width: 100%; 
            padding: 16px; 
            background-color: var(--c-primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.3s; 
        }
        .btn-action:hover { 
            background-color: #d845a3; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(250, 101, 195, 0.2); 
        }

        .error-msg { color: #dc3545; font-weight: bold; font-size: 0.9rem; margin-top: 15px; }
        .hidden { display: none; }

        /* Cabecera del Panel Privado */
        .welcome-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--c-secondary) 0%, #172852 100%);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 14px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(36, 60, 122, 0.2);
        }
        .welcome-header h3 { margin: 0; font-size: 1.3rem; color: white; }
        .welcome-header p { margin: 4px 0 0 0; color: #cbd5e1; font-size: 0.85rem; }

        /* Tarjetas de Información */
        .data-section {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--c-secondary);
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .data-content {
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.6;
            white-space: pre-line;
        }

        .spinner { 
            border: none; 
            border-radius: 10px; 
            height: 6px; 
            width: 60px; 
            margin: 20px auto; 
            background: linear-gradient(90deg, var(--c-secondary), var(--c-primary)); 
            animation: bar-pulse 1.5s infinite ease-in-out; 
            display: none;
        }
        @keyframes bar-pulse { 
            0% { width: 60px; opacity: 0.6; } 
            50% { width: 160px; opacity: 1; } 
            100% { width: 60px; opacity: 0.6; } 
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; border-radius: 15px; }
            .welcome-header { flex-direction: column; align-items: flex-start; gap: 1rem; padding: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="login-container" class="login-box">
            <div class="web-brand">
                <img src="https://github.com/cse-elisagundin/horarios_alumnos/blob/main/image.png?raw=true" alt="Logo CSE" class="web-logo-img">
                <div class="brand-line"></div>
            </div>
            <div class="portal-title">CSE Elisagundin</div>
            <div class="portal-subtitle">Portal del Alumno</div>
            
            <div style="text-align: left;">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="input-field" placeholder="alumno@correo.com">
                
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••">
            </div>
            
            <button id="login-btn" class="btn-action">Iniciar Sesión</button>
            <div id="login-spinner" class="spinner"></div>
            <p id="error-msg" class="error-msg"></p>
        </div>

        <!-- PANEL PRIVADO DEL ALUMNO (Oculto inicialmente) -->
        <div id="dashboard-container" class="hidden">
            
            <div class="web-brand" style="margin-bottom: 10px;">
                <img src="https://github.com/cse-elisagundin/horarios_alumnos/blob/main/image.png?raw=true" alt="Logo CSE" class="web-logo-img">
                <div class="brand-line" style="margin-bottom: 10px;"></div>
            </div>

            <!-- Cabecera de bienvenida -->
            <div class="welcome-header">
                <div>
                    <h3>¡Hola, <span id="user-name">Cargando...</span>! 👋</h3>
                    <p>Consulta tus horarios, calificaciones y estado de pagos</p>
                </div>
                <button id="logout-btn" class="btn-action" style="background: #ef4444; width: auto; padding: 0.5rem 1.2rem; font-size: 0.85rem;">Cerrar Sesión</button>
            </div>

            <!-- Sección Horario -->
            <div class="data-section">
                <div class="section-title">📅 Tu Horario</div>
                <div id="data-horario" class="data-content">Cargando horario...</div>
            </div>

            <!-- Sección Notas -->
            <div class="data-section">
                <div class="section-title">📝 Tus Calificaciones</div>
                <div id="data-notas" class="data-content">Cargando calificaciones...</div>
            </div>

            <!-- Sección Pagos -->
            <div class="data-section">
                <div class="section-title">💳 Estado de Pagos</div>
                <div id="data-pagos" class="data-content">Cargando pagos...</div>
            </div>

        </div>

    </div>

    <script>
        // --- TUS CREDENCIALES DE SUPABASE ---
        const SUPABASE_URL = 'https://wfdfykrkngsdwtkpamrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmZGZ5a3JrbmdzZHd0a3BhbXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDk0MDEsImV4cCI6MjEwMzMyNTQwMX0.ggAJv2kyU7t0UZDeuWzPzg-pwVSG33l3kMXHWBKkhok';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('error-msg');
        const loginSpinner = document.getElementById('login-spinner');
        
        const userName = document.getElementById('user-name');
        const dataHorario = document.getElementById('data-horario');
        const dataNotas = document.getElementById('data-notas');
        const dataPagos = document.getElementById('data-pagos');

        // Comprobar si ya hay sesión activa al cargar la página
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                loadStudentData(session.user.email);
            }
        }

        // Cargar datos desde la tabla 'alumnos' única
        async function loadStudentData(email) {
            loginContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');

            const { data, error } = await supabaseClient
                .from('alumnos')
                .select('*')
                .eq('email', email)
                .single();

            if (error || !data) {
                userName.textContent = email;
                dataHorario.textContent = "No se encontraron datos de horario.";
                dataNotas.textContent = "No se encontraron notas.";
                dataPagos.textContent = "Sin registrar.";
            } else {
                userName.textContent = data.nombre || email;
                dataHorario.textContent = data.horario || "Sin horario asignado.";
                dataNotas.textContent = data.notas || "Sin notas registradas.";
                dataPagos.textContent = data.pagos || "Sin registrar.";
            }
        }

        // Acción de Login
        async function realizarLogin() {
            errorMsg.textContent = '';
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Por favor, rellena todos los campos.';
                return;
            }

            loginSpinner.style.display = 'block';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            loginSpinner.style.display = 'none';

            if (error) {
                errorMsg.textContent = 'Credenciales incorrectas.';
            } else {
                loadStudentData(data.user.email);
            }
        }

        loginBtn.addEventListener('click', realizarLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') realizarLogin();
        });

        // Acción de Logout
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            dashboardContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
            emailInput.value = '';
            passwordInput.value = '';
        });

        checkSession();
    </script>
</body>
</html>
